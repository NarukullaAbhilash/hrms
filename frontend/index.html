<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HRMS - Login</title>

    <!-- HRMS CSS -->
    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                HRMS
            </div>

            <h1>
                Human Resource Management System
            </h1>

            <p class="subtitle">
                Sign in to your account
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <!-- LOGIN MESSAGE -->

            <div id="message"></div>

        </div>

    </div>


    <!-- HRMS JavaScript -->

    <script src="/static/app.js"></script>

</body>

</html>
